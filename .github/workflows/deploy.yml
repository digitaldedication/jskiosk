name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare publish directory
        run: |
          mkdir -p _site
          # Copy everything except the android sources and workflow dirs
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android' \
            --exclude='_site' \
            ./ _site/
      - name: Optimize images for 4K playback
        run: |
          # Camera originals are 10-22 MB each; a 4K screen needs at most
          # 3840px. Resize-down + recompress in the publish dir only (the
          # repo keeps the originals), which cuts transfer and decode time
          # by ~90% for both the web kiosk and the APK sync.
          find _site/media -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -print0 |
          while IFS= read -r -d '' f; do
            mogrify -auto-orient -resize '3840x3840>' -strip -quality 82 "$f" || echo "skip: $f"
          done
          du -sh _site/media/*

      - name: Regenerate media indexes
        run: |
          # Always emit a fresh index.json per category from the files actually
          # in the publish dir. Doing this inline avoids the separate
          # generate-index workflow whose follow-up commit (made with
          # GITHUB_TOKEN) does not retrigger this deploy — leaving Pages
          # stuck with a stale index.
          #
          # A media/<cat>/labels.json ({"file.jpg": "Custom name"}, written by
          # the admin panel) overrides the filename-derived label; such
          # entries are marked "custom": true so the kiosk shows them as-is.
          python3 - <<'EOF'
          import json, os, re

          for category in ['infra', 'groen', 'sport']:
              d = f'_site/media/{category}'
              if not os.path.isdir(d):
                  continue
              labels = {}
              labels_path = os.path.join(d, 'labels.json')
              if os.path.exists(labels_path):
                  try:
                      with open(labels_path, encoding='utf-8') as f:
                          labels = json.load(f)
                  except Exception as e:
                      print(f'warning: unreadable labels.json in {category}: {e}')
              items = []
              for fn in sorted(os.listdir(d), key=str.lower):
                  if fn in ('index.json', 'cover.jpg', 'labels.json') or fn.startswith('.'):
                      continue
                  base, _, ext = fn.rpartition('.')
                  ext = ext.lower()
                  # Skip a .mov when the same video also exists as .mp4:
                  # browsers/WebView play the mp4, and it avoids listing the
                  # same video twice.
                  if ext == 'mov' and os.path.exists(os.path.join(d, base + '.mp4')):
                      continue
                  if ext in ('mp4', 'webm', 'mov'):
                      typ = 'video'
                  elif ext in ('jpg', 'jpeg', 'png', 'webp'):
                      typ = 'image'
                  else:
                      continue
                  entry = {'file': fn}
                  custom = str(labels.get(fn) or '').strip()
                  if custom:
                      entry['label'] = custom
                      entry['custom'] = True
                  else:
                      label = re.sub(r'[-_]', ' ', base)
                      entry['label'] = re.sub(r'\b\w', lambda m: m.group().upper(), label)
                  entry['type'] = typ
                  items.append(entry)
              with open(os.path.join(d, 'index.json'), 'w', encoding='utf-8') as f:
                  json.dump(items, f, ensure_ascii=False, indent=2)
              print(f'Generated {d}/index.json ({len(items)} items)')
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
