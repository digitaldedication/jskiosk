name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare publish directory
        run: |
          mkdir -p _site
          # Copy everything except the android sources and workflow dirs
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android' \
            --exclude='_site' \
            ./ _site/
      - name: Optimize images for 4K playback
        run: |
          # Camera originals are 10-22 MB each; a 4K screen needs at most
          # 3840px. Resize-down + recompress in the publish dir only (the
          # repo keeps the originals), which cuts transfer and decode time
          # by ~90% for both the web kiosk and the APK sync.
          #
          # ImageMagick is not preinstalled on the runner, so use Pillow.
          # This step must fail loudly rather than silently publish 20 MB
          # originals again.
          python3 -m pip install --quiet pillow
          python3 - <<'EOF'
          import os, sys
          from PIL import Image, ImageOps

          MAX_DIM = 3840
          RECOMPRESS_OVER = 2_500_000  # bytes; leave already-small files untouched
          exts = {'.jpg': 'JPEG', '.jpeg': 'JPEG', '.png': 'PNG', '.webp': 'WEBP'}
          failed = []

          for root, _, files in os.walk('_site/media'):
              for fn in files:
                  fmt = exts.get(os.path.splitext(fn)[1].lower())
                  if not fmt:
                      continue
                  path = os.path.join(root, fn)
                  size = os.path.getsize(path)
                  try:
                      with Image.open(path) as im:
                          im = ImageOps.exif_transpose(im)
                          needs_resize = max(im.size) > MAX_DIM
                          if not needs_resize and size <= RECOMPRESS_OVER:
                              continue
                          if needs_resize:
                              im.thumbnail((MAX_DIM, MAX_DIM), Image.LANCZOS)
                          if fmt == 'JPEG' and im.mode not in ('RGB', 'L'):
                              im = im.convert('RGB')
                          kwargs = {'optimize': True}
                          if fmt in ('JPEG', 'WEBP'):
                              kwargs['quality'] = 82
                          if fmt == 'JPEG':
                              kwargs['progressive'] = True
                          im.save(path, fmt, **kwargs)
                      print(f'{path}: {size//1024} KB -> {os.path.getsize(path)//1024} KB')
                  except Exception as e:
                      failed.append(path)
                      print(f'FAILED {path}: {e}')

          if failed:
              sys.exit(f'{len(failed)} image(s) failed to optimize')
          EOF
          du -sh _site/media/*

      # Hercoderen is duur (tot ~10 min per 4K-video); bewaar het resultaat
      # per bron-checksum zodat elke video maar één keer wordt omgezet en
      # elke volgende deploy in seconden klaar is.
      - name: Cache transcoded videos
        uses: actions/cache@v4
        with:
          path: .video-cache
          key: video-cache-v1-${{ hashFiles('media/**/*.mp4', 'media/**/*.mov') }}
          restore-keys: |
            video-cache-v1-

      - name: Optimize videos for TV playback
        run: |
          # 60-90 MB (4K) camera-video's maken de eerste sync traag en laten
          # de videodecoder van signage-borden (RK3566) haperen. Hercodeer
          # naar max 1080p H.264 met faststart; kleine video's blijven staan.
          # Niet voorgeïnstalleerd op de runner (net als ImageMagick destijds):
          # zelf installeren. Mislukt dat, dan faalt de stap luid.
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          command -v ffmpeg >/dev/null || { echo "ffmpeg install failed"; exit 1; }

          # Een .mov met gelijknamige .mp4 staat niet in de index en wordt
          # nooit afgespeeld: niet publiceren.
          find _site/media -type f -iname '*.mov' | while IFS= read -r f; do
            [ -e "${f%.*}.mp4" ] && rm -v "$f"
          done

          mkdir -p .video-cache

          # Let op: -nostdin is verplicht — zonder die vlag leest ffmpeg de
          # rest van de bestandenlijst uit de pipe en verwerkt de lus maar
          # één video.
          find _site/media -type f \( -iname '*.mp4' -o -iname '*.mov' \) -print0 |
          while IFS= read -r -d '' f; do
            w=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$f" | head -n1)
            case "$w" in ''|*[!0-9]*) w=0 ;; esac
            size=$(stat -c%s "$f")
            if [ "$w" -le 1920 ] && [ "$size" -le 26214400 ]; then
              echo "keep: $f (${w}px, $((size/1024/1024)) MB)"
              continue
            fi

            hash=$(sha256sum "$f" | cut -c1-32)
            cached=".video-cache/$hash.mp4"
            if [ -f "$cached" ]; then
              cp "$cached" "$f"
              echo "cache: $f -> $(($(stat -c%s "$f")/1024/1024)) MB"
              continue
            fi

            # Bronnen boven 30 fps terugbrengen naar 30: halveert het werk
            # voor 60fps-materiaal en de TV toont toch geen verschil.
            rate=$(ffprobe -v error -select_streams v:0 -show_entries stream=avg_frame_rate -of csv=p=0 "$f" | head -n1)
            num=${rate%%/*}; den=${rate##*/}
            case "$num$den" in *[!0-9]*) num=0; den=1 ;; esac
            [ "${den:-0}" -gt 0 ] || den=1
            fpsfilter=""
            if [ $((num / den)) -gt 30 ]; then fpsfilter=",fps=30"; fi

            tmp="$f.tmp.mp4"
            if ffmpeg -nostdin -y -v error -i "$f" \
                 -vf "scale=1920:1080:force_original_aspect_ratio=decrease:force_divisible_by=2$fpsfilter" \
                 -c:v libx264 -preset ultrafast -crf 24 -pix_fmt yuv420p \
                 -c:a aac -b:a 128k -movflags +faststart "$tmp"; then
              newsize=$(stat -c%s "$tmp")
              mv "$tmp" "$f"
              cp "$f" "$cached"
              echo "$f: $((size/1024/1024)) MB -> $((newsize/1024/1024)) MB"
            else
              rm -f "$tmp"
              echo "WARN: transcode failed, keeping original: $f"
            fi
          done
          du -sh _site/media/*

      - name: Regenerate media indexes
        run: |
          # Always emit a fresh index.json per category from the files actually
          # in the publish dir. Doing this inline avoids the separate
          # generate-index workflow whose follow-up commit (made with
          # GITHUB_TOKEN) does not retrigger this deploy — leaving Pages
          # stuck with a stale index.
          #
          # A media/<cat>/labels.json ({"file.jpg": "Custom name"}, written by
          # the admin panel) overrides the filename-derived label; such
          # entries are marked "custom": true so the kiosk shows them as-is.
          python3 - <<'EOF'
          import json, os, re

          for category in ['infra', 'groen', 'sport']:
              d = f'_site/media/{category}'
              if not os.path.isdir(d):
                  continue
              labels = {}
              labels_path = os.path.join(d, 'labels.json')
              if os.path.exists(labels_path):
                  try:
                      with open(labels_path, encoding='utf-8') as f:
                          labels = json.load(f)
                  except Exception as e:
                      print(f'warning: unreadable labels.json in {category}: {e}')
              items = []
              for fn in sorted(os.listdir(d), key=str.lower):
                  if fn in ('index.json', 'cover.jpg', 'labels.json') or fn.startswith('.'):
                      continue
                  base, _, ext = fn.rpartition('.')
                  ext = ext.lower()
                  # Skip a .mov when the same video also exists as .mp4:
                  # browsers/WebView play the mp4, and it avoids listing the
                  # same video twice.
                  if ext == 'mov' and os.path.exists(os.path.join(d, base + '.mp4')):
                      continue
                  if ext in ('mp4', 'webm', 'mov'):
                      typ = 'video'
                  elif ext in ('jpg', 'jpeg', 'png', 'webp'):
                      typ = 'image'
                  else:
                      continue
                  entry = {'file': fn}
                  custom = str(labels.get(fn) or '').strip()
                  if custom:
                      entry['label'] = custom
                      entry['custom'] = True
                  else:
                      label = re.sub(r'[-_]', ' ', base)
                      entry['label'] = re.sub(r'\b\w', lambda m: m.group().upper(), label)
                  entry['type'] = typ
                  # Size (post-optimization) lets the service worker detect
                  # changed files and replace its cached copy.
                  entry['size'] = os.path.getsize(os.path.join(d, fn))
                  items.append(entry)
              with open(os.path.join(d, 'index.json'), 'w', encoding='utf-8') as f:
                  json.dump(items, f, ensure_ascii=False, indent=2)
              print(f'Generated {d}/index.json ({len(items)} items)')
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
